[project]
name = "tbstrain"
version = "0.1.0"
description = "TB-Science training-data pipeline: rollouts -> trajectories -> screening -> selection -> MinT SFT export"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "PyYAML>=6.0,<7",
    "zstandard>=0.22",
    "tokenizers>=0.20",
]

[project.scripts]
tbstrain = "tbstrain.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
