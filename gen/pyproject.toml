[project]
name = "tbsgen"
version = "0.1.0"
description = "TB-Science task-generation pipeline v2 (stages S1-S10, budget ledger, leak gates)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "numpy>=2.5.4",
    "tbsretr",
]

[project.scripts]
tbsgen = "tbsgen.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv.sources]
tbsretr = { path = "../retrieval", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
